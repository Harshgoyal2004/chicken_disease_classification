stages:
  data_ingestion:
    cmd: python -c "from src.cnnClassifier.pipeline.stage_01_data_ingestion import DataIngestionPipeline; DataIngestionPipeline().main()"
    deps:
      - config/config.yaml
      - params.yaml
      - src/cnnClassifier/pipeline/stage_01_data_ingestion.py
      - src/cnnClassifier/components/data_ingestion.py
    outs:
      - artifacts/data_ingestion

  prepare_base_model:
    cmd: python -c "from src.cnnClassifier.pipeline.stage_02_prepare_base_model import PrepareBaseModelPipeline; PrepareBaseModelPipeline().main()"
    deps:
      - config/config.yaml
      - params.yaml
      - src/cnnClassifier/pipeline/stage_02_prepare_base_model.py
      - src/cnnClassifier/components/prepare_base_model.py
      - artifacts/data_ingestion
    outs:
      - artifacts/prepare_base_model

  training:
    cmd: python -c "from src.cnnClassifier.pipeline.stage_03_training import TrainingPipeline; TrainingPipeline().main()"
    deps:
      - config/config.yaml
      - params.yaml
      - src/cnnClassifier/pipeline/stage_03_training.py
      - src/cnnClassifier/components/training.py
      - artifacts/prepare_base_model
    outs:
      - artifacts/training

  evaluation:
    cmd: python -c "from src.cnnClassifier.pipeline.stage_04_evaluation import EvaluationPipeline; EvaluationPipeline().main()"
    deps:
      - config/config.yaml
      - params.yaml
      - src/cnnClassifier/pipeline/stage_04_evaluation.py
      - src/cnnClassifier/components/evaluation.py
      - artifacts/training
    outs:
      - artifacts/evaluation


