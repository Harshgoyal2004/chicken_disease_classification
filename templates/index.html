<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Object Classification</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />
  <style>
    body {
      background: #eef1f7;
      font-family: "Segoe UI", sans-serif;
    }

    h3 {
      color: #1a2b6d;
      font-weight: 700;
    }

    .card {
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .image-box {
      height: 320px;
      width: 100%;
      border: 2px dashed #1a2b6d;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: white;
      position: relative;
    }

    .image-box img,
    .image-box video {
      max-height: 100%;
      max-width: 100%;
      border-radius: 6px;
    }

    .results-box {
      height: 330px;
      overflow: auto;
      border-radius: 8px;
      background: white;
      padding: 10px;
      border: 1px solid #ddd;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.7);
      z-index: 9999;
      display: none;
    }

    .loader {
      border: 8px solid #ddd;
      border-top: 8px solid #1a2b6d;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .btn-custom {
      width: 48%;
      font-weight: 600;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <h3 class="text-center mb-4">Object Classification</h3>

    <div class="row">
      <div class="col-md-6 mb-4">
        <div class="card p-3">
          <div class="image-box mb-3">
            <video autoplay id="video"></video>
            <img id="photo" style="display:none;" />
            <canvas id="canvas" style="display:none;"></canvas>
          </div>

          <div class="d-flex justify-content-between">
            <button class="btn btn-primary btn-custom" id="uload">Upload Image</button>
            <button class="btn btn-success btn-custom" id="send">Predict</button>
          </div>
          <input type="file" id="fileinput" style="display:none;" />
          <input type="hidden" id="url" value="../predict" />
        </div>
      </div>

      <div class="col-md-6">
        <div class="card p-3">
          <h5 class="text-center mb-3">Prediction Results</h5>
          <div class="row">
            <div class="col-md-6">
              <div class="results-box" id="image-result"></div>
            </div>
            <div class="col-md-6">
              <div class="results-box" id="json-result"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="loading"><div class="loader"></div></div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script>
    var base_data = "";

    function sendRequest(base64Data) {
      if (!base64Data) return;
      $("#loading").show();
      $.ajax({
        url: $("#url").val(),
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({ image: base64Data }),
        success: function (res) {
          $("#json-result").html(`<pre>${JSON.stringify(res[0], null, 2)}</pre>`);
          try {
            if (res[1].image) {
              $("#image-result").html(`<img style='width:100%; border-radius:6px;' src='data:image/jpeg;base64,${res[1].image}' />`);
            }
          } catch (e) {}
          $("#loading").hide();
        }
      });
    }

    $(document).ready(function () {
      $("#uload").click(() => $("#fileinput").click());

      $("#fileinput").change(function () {
        if (this.files && this.files[0]) {
          var reader = new FileReader();
          reader.onload = function (e) {
            $("#photo").attr("src", e.target.result).show();
            $("#video").hide();

            var img = new Image();
            img.onload = function () {
              var canvas = document.createElement("canvas");
              var ctx = canvas.getContext("2d");
              canvas.width = img.width;
              canvas.height = img.height;
              ctx.drawImage(img, 0, 0);
              base_data = canvas.toDataURL("image/jpeg").replace(/^data:image.+;base64,/, "");
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(this.files[0]);
        }
      });

      $("#send").click(() => sendRequest(base_data));
    });
  </script>
</body>
</html>
